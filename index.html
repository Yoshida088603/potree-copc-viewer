<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="libs/spectrum/spectrum.js"></script>
	<script src="libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="libs/other/BinaryHeap.js"></script>
	<script src="libs/tween/tween.min.js"></script>
	<script src="libs/d3/d3.js"></script>
	<script src="libs/proj4/proj4.js"></script>
	<script src="libs/openlayers3/ol.js"></script>
	<script src="libs/i18next/i18next.js"></script>
	<script src="libs/jstree/jstree.js"></script>
	<script src="libs/copc/index.js"></script>
	<script src="build/potree/potree.js"></script>
	<script src="libs/plasio/js/laslaz.js"></script>

	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->

	<!-- 右上に使い方リンク追加 -->
	<a href="https://note.com/yoshida_shirou/n/n61f55a71a56d" target="_blank" style="position:absolute; top:10px; right:10px; z-index:1100; background:rgba(255,255,255,0.95); padding:6px 14px; border-radius:8px; font-weight:bold; text-decoration:none;">使い方</a>

	<!-- ID入力ボックスを右下に移動し、複数行テキストエリア化 -->
	<div id="copc_control" style="position:absolute; bottom:10px; right:10px; z-index:1000; background:rgba(255,255,255,0.9); padding:10px; border-radius:8px;">
	  <textarea id="copc_id_input" placeholder="COPC IDまたはURL（複数可：カンマ・改行区切り）" style="width:220px; height:60px;"></textarea>
	  <button id="copc_load_btn">表示</button>
	  <br>
	  <span>共有URL: </span><input type="text" id="copc_share_url" style="width:320px;" readonly>
	  <button id="copc_copy_btn">コピー</button>
	  <span id="copc_copy_msg" style="color:green; display:none;">コピーしました</span>
	</div>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script type="module">

	import * as THREE from "./libs/three.js/build/three.module.js";
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		viewer.loadSettingsFromURL();

		viewer.setDescription("Loading COPC format");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
		});

		function getQueryParam(name) {
			name = name.replace(/[\[\]]/g, "\\$&");
			var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
				results = regex.exec(window.location.href);
			if (!results || !results[2]) return null;
			return decodeURIComponent(results[2].replace(/\+/g, " "));
		}

		function updateShareUrl(ids) {
			let url = new URL(window.location.href);
			url.searchParams.set('r', ids);
			document.getElementById('copc_share_url').value = url.toString();
		}

		document.getElementById('copc_copy_btn').onclick = function() {
			let input = document.getElementById('copc_share_url');
			input.select();
			input.setSelectionRange(0, 99999);
			document.execCommand('copy');
			document.getElementById('copc_copy_msg').style.display = 'inline';
			setTimeout(()=>{document.getElementById('copc_copy_msg').style.display='none';}, 1200);
		};

		document.getElementById('copc_load_btn').onclick = function() {
			let val = document.getElementById('copc_id_input').value.trim();
			if (!val) return;
			let url = new URL(window.location.href);
			url.searchParams.set('r', val);
			window.location.href = url.toString();
		};

		// ページロード時、入力欄と共有URLをセット
		let r = getQueryParam('r');
		if (r) {
			document.getElementById('copc_id_input').value = r;
			updateShareUrl(r);
		} else {
			document.getElementById('copc_id_input').value = "104811";
			updateShareUrl("104811");
		}

		// 複数ID対応: カンマ・改行区切りで分割
		let ids = (r ? r : "104811").split(/[,\n\r]+/).map(s => s.trim()).filter(s => s);

		// すべてのID/URLでCOPCを同時表示
		ids.forEach((id, idx) => {
			let path = id.match(/^https?:\/\//) ? id : `https://gsrt.digiarc.aist.go.jp/3ddb-pds/copc/${id}.copc.laz`;
			let name = id;
			Potree.loadPointCloud(path, name, function(e){
				window.viewer.scene.addPointCloud(e.pointcloud);
				let material = e.pointcloud.material;
				material.size = 1;
				material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
				window.viewer.fitToScreen(0.5);
			});
		});
	</script>
  </body>
</html>
