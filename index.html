<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="libs/spectrum/spectrum.js"></script>
	<script src="libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="libs/other/BinaryHeap.js"></script>
	<script src="libs/tween/tween.min.js"></script>
	<script src="libs/d3/d3.js"></script>
	<script src="libs/proj4/proj4.js"></script>
	<script src="libs/openlayers3/ol.js"></script>
	<script src="libs/i18next/i18next.js"></script>
	<script src="libs/jstree/jstree.js"></script>
	<script src="libs/copc/index.js"></script>
	<script src="build/potree/potree.js"></script>
	<script src="libs/plasio/js/laslaz.js"></script>

	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->

	<!-- 追加: ID入力ボックスとボタン、共有URL表示欄 -->
	<div id="copc_control" style="position:absolute; top:10px; right:10px; z-index:1000; background:rgba(255,255,255,0.9); padding:10px; border-radius:8px;">
	  <input type="text" id="copc_id_input" placeholder="COPC IDまたはURL" style="width:200px;">
	  <button id="copc_load_btn">表示</button>
	  <br>
	  <span>共有URL: </span><input type="text" id="copc_share_url" style="width:320px;" readonly>
	  <button id="copc_copy_btn">コピー</button>
	  <span id="copc_copy_msg" style="color:green; display:none;">コピーしました</span>
	</div>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script type="module">

	import * as THREE from "./libs/three.js/build/three.module.js";
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		viewer.loadSettingsFromURL();

		viewer.setDescription("Loading COPC format");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
		});

        var path = "https://gsrt.digiarc.aist.go.jp/3ddb-pds/copc/104811.copc.laz";
		var name = "104811";

		var getQueryParam = function(name) {
			name = name.replace(/[\[\]]/g, "\\$&");
			var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
				results = regex.exec(window.location.href);
			if (!results || !results[2]) return null;
			return decodeURIComponent(results[2].replace(/\+/g, " "));
		}

        // 追加: 共有URL表示関数
        function updateShareUrl(idOrUrl) {
          let url = new URL(window.location.href);
          url.searchParams.set('r', idOrUrl);
          document.getElementById('copc_share_url').value = url.toString();
        }

        // 追加: コピー機能
        document.getElementById('copc_copy_btn').onclick = function() {
          let input = document.getElementById('copc_share_url');
          input.select();
          input.setSelectionRange(0, 99999);
          document.execCommand('copy');
          document.getElementById('copc_copy_msg').style.display = 'inline';
          setTimeout(()=>{document.getElementById('copc_copy_msg').style.display='none';}, 1200);
        };

        // 追加: ボタン押下時の挙動
        document.getElementById('copc_load_btn').onclick = function() {
          let val = document.getElementById('copc_id_input').value.trim();
          if (!val) return;
          let url = new URL(window.location.href);
          url.searchParams.set('r', val);
          window.location.href = url.toString();
        };

        // 追加: ページロード時、入力欄と共有URLをセット
        let r = getQueryParam('r');
        if (r) {
          document.getElementById('copc_id_input').value = r;
          updateShareUrl(r);
        } else {
          document.getElementById('copc_id_input').value = name;
          updateShareUrl(name);
        }

        // 既存のr取得ロジックを活用
        if (r) {
            name = r;
            var http = 'http';
            if (r.substr(0, http.length) == http) path = name;
            else path = `https://gsrt.digiarc.aist.go.jp/3ddb-pds/copc/${name}.copc.laz`;
        }

		var c = getQueryParam('c');
		Potree.loadPointCloud(path, name, function(e){
			viewer.scene.addPointCloud(e.pointcloud);

			let material = e.pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			if (c) material.activeAttributeName = c;

			viewer.fitToScreen(0.5);
		});
	</script>
  </body>
</html>
