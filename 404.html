<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // クエリやハッシュも維持してindex.htmlにリダイレクト
      var redirect = location.origin + location.pathname.replace(/\/[^\/]*$/, "/") + "index.html" + location.search + location.hash;
      location.replace(redirect);
    </script>
  </head>
  <body>
    <p>リダイレクト中です...</p>
  </body>
</html>
